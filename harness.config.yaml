version: 1
proxy:
  host: "127.0.0.1"
  port: 4103
store:
  home: "~/.own-harness"
  retentionDays: 90
telemetry:
  enabled: false
  optInFile: "~/.own-harness/telemetry.json"
server:
  host: "127.0.0.1"
rtk:
  enabled: false
